*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--surface);color:var(--ink);font-family:var(--ui);-webkit-font-smoothing:antialiased;overflow:hidden;-webkit-tap-highlight-color:transparent}
button,input{font:inherit;color:inherit}
h1,h2,p{margin:0}
a{color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* type roles: rem sizes follow the reader's text size; capped roles stop growing */
.t-body{font:400 1.0625rem/1.412 var(--ui)}
.t-strong{font:700 1.0625rem/1.412 var(--ui)}
.t-label{font:400 .9375rem/1.333 var(--ui)}
.t-small{font:400 .8125rem/1.385 var(--ui)}
.t-tab{font:700 .75rem/1.167 var(--ui)}
.t-num{font:700 1.3125rem/1.143 var(--display);font-variant-numeric:tabular-nums;letter-spacing:.01em}
.t-title{font:700 min(1.75rem,42px)/1.07 var(--display);font-variant-numeric:tabular-nums}
.t-hero{font:700 min(2.5rem,48px)/1 var(--display);font-variant-numeric:tabular-nums}
.muted{color:var(--ink-muted)}

/* screen: pinned head, scrolling body; the tab bar is the app's last row */
.app{height:100%;display:grid;grid-template-rows:minmax(0,1fr) auto}
.screen{display:grid;grid-template-rows:auto minmax(0,1fr);min-height:0}
.head{padding:var(--s4) var(--gutter-r) var(--s3) var(--gutter-l);transition:box-shadow 160ms}
.head[data-scrolled]{box-shadow:0 1px 0 var(--rule)}
.body[data-more]{-webkit-mask-image:linear-gradient(to bottom,#000 calc(100% - 24px),transparent);mask-image:linear-gradient(to bottom,#000 calc(100% - 24px),transparent)}
.body{overflow-y:auto;overscroll-behavior:contain;padding:0 var(--gutter-r) var(--s8) var(--gutter-l)}
.content{display:flex;flex-direction:column;gap:var(--s8);max-width:560px;margin:0 auto}
.group{display:flex;flex-direction:column;gap:var(--s3)}
.row-h{display:flex;justify-content:space-between;align-items:baseline;gap:var(--s4)}
.is-stacked{flex-direction:column;align-items:flex-start;gap:var(--s1)}

/* tab bar */
nav.tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));background:var(--surface-raised);border-top:1px solid var(--rule);padding:var(--s2) calc(var(--gutter-r) - 8px) var(--s2) calc(var(--gutter-l) - 8px)}

nav.tabs a[aria-current="page"]{color:var(--ink)}
nav.tabs .bar{position:absolute;top:0;left:0;width:25%;height:3px;border-radius:0 0 3px 3px;background:var(--accent);transition:transform var(--motion-settle-duration) var(--motion-settle-easing)}
nav.tabs{position:relative;z-index:6}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--s3);min-height:52px;padding:0 var(--s5);border-radius:var(--r2);border:0;cursor:pointer;text-decoration:none;transition:transform var(--motion-press-duration) var(--motion-press-easing),background-color var(--motion-fade-duration) var(--motion-fade-easing),opacity var(--motion-fade-duration)}
.btn.primary{background:var(--primary);color:var(--on-primary)}
.btn.secondary{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink)}
.btn.quiet{background:transparent;color:var(--ink-muted);min-height:44px;padding:0 var(--s3)}
.btn:active:not(:disabled){transform:scale(.98);transition:none}
.btn.primary:active:not(:disabled){background:color-mix(in srgb,var(--primary) 92%,#000)}
.btn.secondary:active,.btn.quiet:active{background:var(--surface-sunk)}
.btn:disabled{opacity:.4;cursor:default}
@media (hover:hover) and (pointer:fine){.btn.quiet:hover{color:var(--ink)}.btn.secondary:hover{background:color-mix(in srgb,var(--surface-sunk) 60%,transparent)}}
.icon-btn{width:44px;height:44px;flex:none;border-radius:50%;border:0;background:transparent;color:var(--ink-muted);display:grid;place-items:center;cursor:pointer}
.icon-btn:active{background:var(--surface-sunk)}
.icon-btn:disabled{opacity:.4}
.icon-btn svg{width:20px;height:20px}

/* ---------- Today ---------- */
.today-head{display:flex;justify-content:space-between;align-items:center;gap:var(--s4);min-height:44px}
.head-label{display:grid}
.head-label > *{grid-area:1/1;transition:opacity 120ms linear}
#head-session{opacity:0}
.plate{position:relative;width:100%;max-width:358px;aspect-ratio:1;margin:var(--s3) auto 0;touch-action:none;user-select:none;-webkit-user-select:none;outline-offset:6px;border-radius:50%}
.plate .shadow{position:absolute;inset:3% 1% -1% 5%;border-radius:50%;background:#000;opacity:.32;filter:blur(14px)}
.plate img{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.plate svg.wedges{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.plate .labels{position:absolute;inset:0;pointer-events:none}
.plate .lbl{position:absolute;transform:translate(-50%,-50%);text-align:center;white-space:nowrap;line-height:1}
.plate .lbl b{display:block;font:700 21px/1 var(--display);color:var(--on-rubber)}
.plate .lbl span{display:block;font:400 12px/1.2 var(--ui);color:var(--on-rubber-muted);margin-top:2px}
.plate .lbl.focus b{font-size:25px;color:var(--on-wedge)}
.plate .lbl.focus span{color:var(--on-wedge);opacity:.85}
.plate .mark{position:absolute;top:-16px;left:50%;width:20px;height:14px;margin-left:-10px;background:var(--ink);clip-path:polygon(0 0,100% 0,50% 100%)}
.plate .hub{position:absolute;left:50%;top:50%;width:36%;height:36%;transform:translate(-50%,-50%);border-radius:50%;border:0;background:transparent;cursor:pointer;pointer-events:auto}
.answer-block{display:flex;flex-direction:column;align-items:center;gap:var(--s1);text-align:center}
#session{transition:opacity var(--motion-fade-duration)}
.session-list{display:flex;flex-direction:column;gap:var(--s6)}
.rx{display:flex;justify-content:space-between;align-items:baseline;gap:var(--s4);padding-bottom:var(--s2);border-bottom:1px solid var(--rule)}
.rx .rest{display:inline-flex;align-items:center;gap:var(--s2);color:var(--ink-muted)}
.rx .rest svg{width:14px;height:14px}
.ex-rows{list-style:none;margin:0;padding:0}
.ex-row{display:flex;align-items:center;gap:var(--s3);min-height:48px;width:100%;padding:var(--s3) 0;border:0;background:transparent;text-align:left;cursor:pointer;border-radius:var(--r1)}
.ex-row .num{width:24px;flex:none;color:var(--ink-muted)}
.ex-row .nm{flex:1;min-width:0;overflow-wrap:anywhere}
.ex-row svg{width:16px;height:16px;flex:none;color:var(--ink-faint)}
.ex-row:active{background:var(--surface-sunk)}
@media (hover:hover) and (pointer:fine){.ex-row:hover{background:color-mix(in srgb,var(--surface-sunk) 60%,transparent)}}
.checks{display:flex;flex-direction:column;gap:var(--s3)}
.check{position:relative;display:flex;align-items:center;gap:var(--s4);min-height:52px;padding:var(--s3) var(--s4);border-radius:var(--r2);background:var(--surface-raised);box-shadow:inset 0 0 0 1px var(--rule);cursor:pointer;transition:background-color var(--motion-fade-duration) var(--motion-fade-easing)}
.check input{position:absolute;opacity:0;width:1px;height:1px}
.check .box{width:22px;height:22px;flex:none;border-radius:6px;box-shadow:inset 0 0 0 2px var(--rule);display:grid;place-items:center;transition:background-color var(--motion-fade-duration) var(--motion-fade-easing)}
.check .box svg{width:14px;height:14px;color:#fff;clip-path:inset(0 100% 0 0);transition:clip-path 120ms var(--motion-fade-easing)}
.check:has(input:checked){background:var(--tint-done)}
.check:has(input:checked) .box{background:var(--ok);box-shadow:none}
.check:has(input:checked) .box svg{clip-path:inset(0 0 0 0)}
.check:has(input:focus-visible){outline:3px solid var(--accent);outline-offset:2px}
.check:has(input:disabled){cursor:default;opacity:.6}

/* ---------- Progress ---------- */
.machine{display:grid;grid-template-columns:minmax(0,1fr) 176px;grid-template-areas:"stats stack" "form stack";column-gap:var(--s4);row-gap:var(--s6);align-items:start}
.machine .stats{grid-area:stats}
.machine #log-form{grid-area:form}
.machine .stack{grid-area:stack}
.stats{display:flex;flex-direction:column;gap:var(--s4)}
.stat{display:flex;flex-direction:column}
.roll{display:inline-block}
.kg-row{display:flex;align-items:center;gap:var(--s1)}
.field{display:flex;flex-direction:column;gap:var(--s1);min-width:0;flex:1}
.field input{width:100%;min-width:0;height:52px;padding:0 var(--s3);border-radius:var(--r2);border:1px solid var(--rule);background:var(--surface-raised);color:var(--ink);font:700 1.5rem/1 var(--display);font-variant-numeric:tabular-nums;text-align:center}
.field input[type=date]{font:400 .9375rem/1 var(--ui);height:44px}
.field input:focus-visible{outline:3px solid var(--accent);outline-offset:1px;border-color:var(--ink)}
.field input[aria-invalid="true"]{border:2px solid var(--error)}
.field .msg{min-height:1.2em;color:var(--error)}
.stack{position:relative;flex:none;width:176px;height:618px;touch-action:none;user-select:none;-webkit-user-select:none}
.stack img{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.stack .stampv{position:absolute;right:10px;transform:translateY(-50%);font:700 21px/1 var(--display);color:var(--stamp);font-variant-numeric:tabular-nums;transition:color 300ms}
.stack .stampv.lit{color:#FFD9CF}
.stack .pin{position:absolute;left:62.7px;width:24px;height:24px;margin-top:-12px;border-radius:50%;border:0;padding:0;cursor:grab;background:radial-gradient(circle at 35% 30%,#F07A5F,var(--pin) 55%,#A12E1B);box-shadow:2px 3px 5px rgba(0,0,0,.45)}
.stack .pin{z-index:2}
.stack .pin::after{content:"";position:absolute;inset:-12px;border-radius:50%}
.stack .pin:active{cursor:grabbing;transform:scale(1.08)}
.trend svg{display:block;width:100%;height:160px}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:var(--s2)}
.week .col{display:flex;flex-direction:column;align-items:center;gap:var(--s2);padding:var(--s3) 0;border-radius:var(--r2)}
.week .col.today{box-shadow:inset 0 0 0 1.5px var(--ink-faint)}
.week .dots{display:grid;grid-template-columns:repeat(2,8px);gap:4px}
.week .dot{width:8px;height:8px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--rule)}
.week .dot.on{background:var(--ok);box-shadow:none}
.weighins{list-style:none;margin:0;padding:0}
.wrow{display:flex;justify-content:space-between;align-items:center;gap:var(--s4);min-height:48px;border-top:1px solid var(--rule);cursor:pointer}
.wrow:first-child{border-top:0}
.wrow .kg{margin-left:auto}

/* ---------- Food ---------- */
.chips{display:flex;flex-wrap:wrap;gap:var(--s2)}
#days{flex-wrap:nowrap;justify-content:space-between}
#days .chip{flex:1 1 0;padding:0}
.chip{min-height:44px;min-width:44px;padding:0 var(--s3);border-radius:var(--r2);border:0;background:var(--surface-raised);box-shadow:inset 0 0 0 1px var(--rule);color:var(--ink);cursor:pointer;max-width:100%;white-space:normal;transition:background-color var(--motion-fade-duration) var(--motion-fade-easing),color var(--motion-fade-duration)}
.chip[aria-checked="true"]{background:var(--primary);color:var(--on-primary);box-shadow:none}
.chip:active{background:var(--surface-sunk)}
.thali{position:relative;width:100%;max-width:358px;aspect-ratio:1;margin:var(--s3) auto 0}
.thali .shadow{position:absolute;inset:4% 2% 0 6%;border-radius:50%;background:#000;opacity:.28;filter:blur(14px)}
.thali img{position:absolute;inset:0;width:100%;height:100%}
.thali .rule{position:absolute;background:var(--surface-raised);color:var(--ink);border-radius:var(--r1);padding:var(--s1) var(--s3);white-space:nowrap;box-shadow:0 1px 2px rgba(0,0,0,.18)}
.thali .rule.salad{left:2%;top:47%}
.thali .rule.protein{right:0;top:4%}
.thali .rule.carb{right:0;bottom:3%}
.rules-below{display:none;justify-content:center;gap:var(--s3);flex-wrap:wrap}

.meal:first-child{border-top:0}
.meal .txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:var(--s1)}
.meal .cal{white-space:nowrap;font-variant-numeric:tabular-nums}
.total{display:flex;justify-content:space-between;align-items:baseline;gap:var(--s4);padding-bottom:var(--s3);border-bottom:2px solid var(--ink)}
.recipe{border-top:1px solid var(--rule)}
.recipe:first-child{border-top:0}
.recipe > button{display:flex;flex-direction:column;align-items:flex-start;gap:var(--s1);width:100%;min-height:56px;padding:var(--s3) 0;border:0;background:transparent;text-align:left;cursor:pointer}
.recipe .panel{display:flex;flex-direction:column;gap:var(--s3);padding-bottom:var(--s5)}
.recipe ol,.recipe ul{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:var(--s2)}
.tip{background:var(--surface-raised);border-radius:var(--r2);padding:var(--s3) var(--s4)}
.drink{display:flex;gap:var(--s4);align-items:center;padding:var(--s3) 0;border-top:1px solid var(--rule)}
.drink:first-child{border-top:0}
.drink .dot{width:12px;height:12px;border-radius:50%;flex:none}
.drink .cal{white-space:nowrap;font-variant-numeric:tabular-nums}
.dot.ok{background:var(--ok)} .dot.care{background:var(--warn)} .dot.no{background:var(--error)}

.jumps{display:flex;flex-wrap:wrap;column-gap:var(--s4);margin-top:calc(-1 * var(--s6))}
.jumps button{min-height:44px;min-width:44px;padding:0;border:0;background:transparent;color:var(--ink);cursor:pointer;text-decoration:underline;text-decoration-color:var(--ink-faint);text-underline-offset:4px}
.jumps button:active{color:var(--ink-muted)}

/* ---------- Guide ---------- */
.targets{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--s4)}
.rule-row{display:flex;flex-direction:column;gap:var(--s1);padding:var(--s2) 0}
.bullets{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:var(--s2)}
.stop{background:var(--tint-avoid);border-radius:var(--r2);padding:var(--s3) var(--s4)}

/* ---------- sheet and toast ---------- */
dialog.sheet{position:fixed;inset:auto 0 0 0;margin:0 auto;width:100%;max-width:600px;max-height:88%;border:0;padding:0;border-radius:var(--r3) var(--r3) 0 0;background:var(--surface-raised);color:var(--ink);overflow:auto;transform:translateY(0);
  transition:transform var(--motion-page-duration) var(--motion-page-easing),overlay var(--motion-page-duration) allow-discrete,display var(--motion-page-duration) allow-discrete}
dialog.sheet:not([open]){transform:translateY(100%);transition-timing-function:var(--motion-exit-easing);transition-duration:var(--motion-exit-duration)}
@starting-style{dialog.sheet[open]{transform:translateY(100%)}}
dialog.sheet::backdrop{background:color-mix(in srgb,var(--scrim) 45%,transparent);opacity:1;transition:opacity var(--motion-page-duration),overlay var(--motion-page-duration) allow-discrete,display var(--motion-page-duration) allow-discrete}
dialog.sheet:not([open])::backdrop{opacity:0}
@starting-style{dialog.sheet[open]::backdrop{opacity:0}}
.sheet-in{padding:var(--s3) var(--gutter-r) calc(var(--s7) + env(safe-area-inset-bottom,0px)) var(--gutter-l);display:flex;flex-direction:column;gap:var(--s5)}
.grab{width:36px;height:4px;border-radius:2px;background:var(--rule);margin:var(--s2) auto 0}
.sheet-top{display:flex;justify-content:space-between;align-items:flex-start;gap:var(--s3)}
.avoid{background:var(--tint-avoid);border-radius:var(--r2);padding:var(--s4)}
.links{display:flex;gap:var(--s3)}
.links .btn{flex:1;min-height:48px}

.toast.show{visibility:visible;transform:none;pointer-events:auto;transition:transform var(--motion-enter-duration) var(--motion-enter-easing),visibility 0s}
.toast .btn.quiet{color:var(--on-primary);font-weight:700;min-width:64px}
.note-line{min-height:1.4em}

/* large text: words leave the drawings, the machine stacks */
.text-large .plate{max-width:280px}
.text-large .machine{grid-template-columns:minmax(0,1fr) 120px;grid-template-areas:"stats stack" "form form"}
.text-large .stack{width:120px;height:421px}

.text-large #days .chip{flex:none;padding:0 var(--s3)}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

addEventListener("resize", () => { drawPlate(); if (current === "progress") { buildStack(); placePin(latest() ?? START, false); } });
document.addEventListener("touchstart", () => {}, { passive: true });   // lets :active show on iPhone
const textLarge = () => document.documentElement.classList.toggle("text-large", parseFloat(getComputedStyle(document.documentElement).fontSize) >= 24);

/* ---------- saving: the db capability on claude.ai, this browser everywhere else ---------- */
const queues = new Map();
function enqueue(path, job) { const prev = queues.get(path) || Promise.resolve(); const next = prev.then(job, job); queues.set(path, next.catch(() => {})); return next; }
function writeFailed(err) {
  if (err && (err.code === "invalid_argument" || err.code === "not_granted")) { S.sync = "readonly"; refreshSync(); }
  toast(t("save.error"));
}
function writeDay(date, doc) {
  if (!S.db) return Promise.resolve(false);
  return enqueue("days/" + date, () => S.db.doc(`days/${date}`).set({ missed: !!doc.missed, habits: doc.habits || [] })).then(() => true, (e) => (writeFailed(e), false));
}
function writeWeighin(date, kg) {
  if (!S.db) return Promise.resolve(VERIFY);
  return enqueue("weighins/" + date, () => S.db.doc(`weighins/${date}`).set({ kg })).then(() => true, (e) => (writeFailed(e), false));
}
function removeWeighin(date) {
  if (!S.db) return Promise.resolve(VERIFY);
  return enqueue("weighins/" + date, () => S.db.doc(`weighins/${date}`).delete()).then(() => true, (e) => (writeFailed(e), false));
}
function refreshSync() { renderHabits(); if (shown.has("progress")) renderProgress(false); }
// The db capability's documents and snapshots, kept in this browser: off claude.ai there's no account to save to.
// Snapshots arrive a microtask after a write, as the db's do.
function browserDb() {
  const KEY = "playbook", listeners = new Set();
  let docs = {};
  try { docs = JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) {}
  navigator.storage?.persist?.();   // asks the browser not to clear it when space runs low
  const listen = (fn) => { listeners.add(fn); queueMicrotask(fn); };
  const write = (path, value) => new Promise((resolve) => {
    const next = { ...docs };
    if (value === undefined) delete next[path]; else next[path] = value;
    localStorage.setItem(KEY, JSON.stringify(next));   // full or blocked storage throws, and the write fails
    docs = next;
    resolve();
    queueMicrotask(() => listeners.forEach((fn) => fn()));
  });
  return {
    doc: (path) => ({
      set: (value) => write(path, value),
      delete: () => write(path, undefined),
      onSnapshot: (cb) => listen(() => { const value = docs[path]; cb({ exists: value !== undefined, data: () => value }); }),
    }),
    collection: (name) => ({
      onSnapshot: (cb) => listen(() => cb({
        metadata: { fromCache: false },
        docs: Object.entries(docs).filter(([p]) => p.startsWith(name + "/")).map(([p, value]) => ({ id: p.slice(name.length + 1), data: () => value })),
      })),
    }),
  };
}
async function connect() {
  if (VERIFY) return;
  const db = ON_CLAUDE ? await window.claude?.use?.("db") : browserDb();
  if (!db) { S.sync = "offline"; refreshSync(); return; }
  S.db = db;
  const slow = setTimeout(() => { if (S.sync === "loading") { S.sync = "slow"; refreshSync(); } }, 10000);
  const settle = (snap) => { if (!snap.metadata.fromCache && (S.sync === "loading" || S.sync === "slow")) { clearTimeout(slow); S.sync = "ready"; refreshSync(); } };
  const onErr = (e) => { clearTimeout(slow); if (e && e.code === "revoked") S.sync = "offline"; refreshSync(); };
  db.doc("plan/rotation").onSnapshot((snap) => {
    const d = snap.exists ? snap.data() : null;
    S.anchor = d && typeof d.date === "string" && Number.isInteger(d.index) ? { date: d.date, index: d.index } : { ...DEFAULT_ANCHOR };
    renderToday();
  }, onErr);
  db.collection("days").onSnapshot((snap) => {
    S.days = new Map(snap.docs.map((d) => [d.id, d.data()]));
    renderToday(); if (shown.has("progress")) renderWeek(); settle(snap);
  }, onErr);
  db.collection("weighins").onSnapshot((snap) => {
    S.weighins = snap.docs.filter((d) => typeof d.data().kg === "number").map((d) => ({ date: d.id, kg: d.data().kg })).sort((a, b) => (a.date < b.date ? -1 : 1));
    if (shown.has("progress")) renderProgress(true); settle(snap);
  }, onErr);
}

/* ---------- verification fixtures (only with window.__UISPEC__ or ?state=) ---------- */
function seedFixtures() {
  const st = SPEC.state || "";
  S.sync = st === "offline" ? "offline" : "ready";
  if (!SPEC.date) S.today = "2026-11-16";
  if (st === "rest") S.today = "2026-11-22";
  if (st === "missed") S.days.set(S.today, { missed: true, habits: [] });
  if (["training", "missed", "looking-ahead", "sheet", "worst-case", "rest"].includes(st)) S.days.set(S.today, { ...(S.days.get(S.today) || {}), habits: st === "worst-case" ? [0, 1, 2, 3, 4, 5] : [0, 2, 4] });
  if (["ready", "saved", "busy", "worst-case"].includes(st) && (SPEC.screen === "progress")) {
    S.weighins = [{ date: "2026-11-12", kg: 119.1 }, { date: "2026-11-14", kg: 118.8 }, { date: "2026-11-16", kg: 118.4 }];
    if (st === "worst-case") S.weighins = Array.from({ length: 40 }, (_, i) => ({ date: addDays("2026-10-08", i), kg: Math.round((129.9 - i * 0.05) * 10) / 10 }));
  }
  S.foodDay = st === "other-day" ? "Tue" : st === "worst-case" && SPEC.screen === "food" ? "Sun" : WD[dow(S.today)];
  if (st === "recipe-open") S.recipeOpen = 1;
}

/* ---------- start ---------- */
if (VERIFY) seedFixtures();
textLarge();
buildPlate();
renderToday(); renderFood(); renderGuide(); renderProgress(false);
route(true);
if (VERIFY && SPEC.state === "looking-ahead") lookAt(2, { instant: true });
if (VERIFY && SPEC.state === "sheet") openSheet("incline", "3 × 10–12|90 s");
if (VERIFY && SPEC.state === "saved") toast(t("saved.toast", { "weight.latest": "118.4" }), t("undo"), null);
if (VERIFY && SPEC.state === "missed") toast(t("missed.toast"), t("undo"), null);
// the daily turn: the first open of a new training day turns the plate from yesterday's wedge
(function dailyTurn() {
  if (VERIFY) return;
  let last = null; try { last = localStorage.getItem("plate-day"); } catch (e) {}
  try { localStorage.setItem("plate-day", S.today); } catch (e) {}
  if (last && last !== S.today && todayState() === "training") { turn.angle = 60; drawPlate(); setTimeout(() => turnTo(0), 250); }
})();
document.fonts?.ready.then(() => { textLarge(); drawPlate(); });
connect();
</script>
<script>navigator.serviceWorker?.register("sw.js")</script></body></html>
